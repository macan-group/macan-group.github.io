name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  # Skip (neutral, not failed) until the FTP secrets are configured.
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secrets not set — deploy skipped. See docs/ci-cd.md."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # To require manual approval before each deploy: create an Environment named
    # "production" in repo Settings with a required reviewer, then uncomment:
    # environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sanity check output
        run: |
          test -f out/index.html
          test -f out/sendmail.php
          test -f out/.htaccess

      # Incremental FTPS sync of out/ -> cPanel document root.
      # Files removed from the build are also removed on the server.
      # A server-only sendmail.config.php (if you add one) is preserved.
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/sendmail.config.php
            **/.well-known/**
